name: FarmFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

  test-suite:
    name: Automated Software Testing Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Testing Suite (Unit, Integration, System, Acceptance, Functional, White/Black Box)
        run: npm test -- --coverage --watchAll=false

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  expo-validation:
    name: Expo Health & EAS Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-suite]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor Diagnostics
        run: npx expo-doctor

      - name: Verify EAS Config
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: npx --yes eas-cli@latest config --profile preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  visual-and-e2e:
    name: Visual Regression & E2E Validation
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-suite]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directories
        run: mkdir -p coverage test-results playwright-report

      - name: Build Web Application for E2E
        run: npx expo export --platform web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Visual Regression & E2E
        run: npx playwright test --update-snapshots

      - name: Upload Visual Snapshots and Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-artifacts
          path: |
            coverage/
            test-results/
            playwright-report/
          retention-days: 7
